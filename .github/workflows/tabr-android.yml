name: Build TABR Android APK
on:
  push:
    branches: [tabr-android]
    paths:
      - 'TabrAndroid/**'
      - '.github/workflows/tabr-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: TabrAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TABR-debug-apk
          path: TabrAndroid/app/build/outputs/apk/debug/app-debug.apk
